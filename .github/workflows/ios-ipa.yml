name: iOS IPA Build (P-Slice)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Install Haxelib dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install hxcpp
          haxelib install tjson
          haxelib install hscript
          haxelib install hscript-iris
          haxelib install lime-tools
          haxelib run lime setup

      - name: Verify project structure
        run: |
          ls -R

      - name: Build iOS project (no signing IPA build)
        run: |
          cd PSliceEngine
          haxelib run lime build ios -DNO_CODE_SIGN

      - name: Fix Xcode signing (force disable)
        run: |
          cd PSliceEngine/bin/ios
          xcodebuild -project PSliceEngine.xcodeproj \
            -scheme PSliceEngine \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Archive IPA (unsigned)
        run: |
          cd PSliceEngine/bin/ios
          mkdir -p Payload
          cp -r Release-iphoneos/PSliceEngine.app Payload/
          zip -r PSliceEngine.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PSliceEngine-IPA
          path: PSliceEngine/bin/ios/PSliceEngine.ipa
