name: Build IPA (P-Slice)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install haxe

      - name: Setup Haxelib
        run: |
          export HAXELIB_ROOT="$HOME/haxelib"
          mkdir -p $HAXELIB_ROOT
          haxelib setup $HAXELIB_ROOT

      - name: Install Haxe libraries
        run: |
          export HAXELIB_ROOT="$HOME/haxelib"

          haxelib install lime 8.3.2 --force
          haxelib install openfl 9.5.2 --force
          haxelib install flixel 5.6.2 --force
          haxelib install flixel-addons 3.3.2 --force
          haxelib install hxcpp 4.3.2 --force
          haxelib install hscript 2.7.0 --force
          haxelib install hscript-iris 1.1.3 --force
          haxelib install tjson 1.4.0 --force

          haxelib set lime 8.3.2
          haxelib set openfl 9.5.2
          haxelib set flixel 5.6.2
          haxelib set hxcpp 4.3.2

      - name: Verify repo structure
        run: |
          echo "=== ROOT ==="
          ls -R .

      # IMPORTANT FIX: find real xcodeproj dynamically
      - name: Locate Xcode project
        id: findproj
        run: |
          PROJ=$(find . -name "*.xcodeproj" -type d | head -n 1)

          if [ -z "$PROJ" ]; then
            echo "No .xcodeproj found!"
            exit 1
          fi

          echo "FOUND: $PROJ"
          echo "proj=$PROJ" >> $GITHUB_OUTPUT

      - name: Build iOS App (Xcode)
        run: |
          set -e

          cd "$(dirname "${{ steps.findproj.outputs.proj }}")"

          xcodebuild \
            -project "$(basename "${{ steps.findproj.outputs.proj }}")" \
            -scheme PSliceEngine \
            -configuration Release \
            -sdk iphoneos \
            clean build

      - name: Find built .app
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | grep -i PSlice | head -n 1)

          if [ -z "$APP" ]; then
            echo "No .app found in DerivedData!"
            exit 1
          fi

          echo "APP FOUND: $APP"
          echo "APP_PATH=$APP" >> $GITHUB_ENV

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -r PSliceEngine.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PSliceEngine-IPA
          path: PSliceEngine.ipa
