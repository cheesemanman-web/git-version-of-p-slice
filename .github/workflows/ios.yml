name: Build IPA (P-Slice 3.4.2)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      DEVELOPMENT_TEAM: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Install Haxe
      # -----------------------------
      - name: Install Haxe
        run: |
          brew update
          brew install haxe

          haxelib setup ~/haxelib

      # -----------------------------
      # Install EXACT P-Slice deps
      # -----------------------------
      - name: Install dependencies
        run: |
          haxelib install hxcpp 4.3.2
          haxelib install lime 8.3.2
          haxelib install openfl 9.5.2

          haxelib install flixel
          haxelib install flixel-addons
          haxelib install tjson 1.4.0
          haxelib install flxanimate

          haxelib install hscript-iris 1.1.3

      # -----------------------------
      # IMPORTANT FIX (THIS IS THE MISSING PIECE)
      # -----------------------------
      - name: Initialize Lime/OpenFL
        run: |
          haxelib run lime setup -y
          haxelib run openfl setup -y

      # -----------------------------
      # Debug environment (VERY IMPORTANT)
      # -----------------------------
      - name: Show haxelib state
        run: |
          haxelib list
          haxe -version

      # -----------------------------
      # Build Haxe (correct path)
      # -----------------------------
      - name: Build Haxe
        working-directory: ${{ github.workspace }}/PSliceEngine/haxe
        run: |
          haxe Build.hxml -D HXCPP_ARM64

      # -----------------------------
      # Build iOS app
      # -----------------------------
      - name: Build Xcode project
        working-directory: ${{ github.workspace }}
        run: |
          xcodebuild \
            -project PSliceEngine.xcodeproj \
            -scheme PSliceEngine \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      # -----------------------------
      # Archive
      # -----------------------------
      - name: Archive
        run: |
          xcodebuild \
            -project PSliceEngine.xcodeproj \
            -scheme PSliceEngine \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            archive \
            -archivePath build/P-Slice.xcarchive

      # -----------------------------
      # Export IPA
      # -----------------------------
      - name: Export IPA
        run: |
          mkdir -p export

          xcodebuild -exportArchive \
            -archivePath build/P-Slice.xcarchive \
            -exportPath export \
            -exportOptionsPlist ExportOptions.plist

      # -----------------------------
      # Upload IPA
      # -----------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: P-Slice-3.4.2-IPA
          path: export/*.ipa
