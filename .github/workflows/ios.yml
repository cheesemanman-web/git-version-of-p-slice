name: Build IPA (P-Slice)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      DEVELOPMENT_TEAM: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Install Haxe + libraries
      # -------------------------
      - name: Install Haxe + deps
        run: |
          brew update
          brew install haxe

          haxelib setup ~/haxelib
          haxelib install lime
          haxelib install openfl
          haxelib install hxcpp
          haxelib install flixel

      # -------------------------
      # Show environment
      # -------------------------
      - name: Debug versions
        run: |
          haxe -version
          xcodebuild -version

      # -------------------------
      # Build Haxe (YOUR PATH FIXED)
      # -------------------------
      - name: Build Haxe
        working-directory: ${{ github.workspace }}/PSliceEngine/haxe
        run: |
          haxe Build.hxml -D HXCPP_ARM64

      # -------------------------
      # Build Xcode .app
      # -------------------------
      - name: Build Xcode project
        working-directory: ${{ github.workspace }}
        run: |
          xcodebuild \
            -project PSliceEngine.xcodeproj \
            -scheme PSliceEngine \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            clean build \
            BUILD_DIR=build

      # -------------------------
      # Archive .app into .xcarchive
      # -------------------------
      - name: Create Archive
        run: |
          xcodebuild \
            -project PSliceEngine.xcodeproj \
            -scheme PSliceEngine \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            archive \
            -archivePath build/PSliceEngine.xcarchive

      # -------------------------
      # Export IPA
      # -------------------------
      - name: Export IPA
        run: |
          mkdir -p export

          xcodebuild -exportArchive \
            -archivePath build/PSliceEngine.xcarchive \
            -exportPath export \
            -exportOptionsPlist ExportOptions.plist

      # -------------------------
      # Upload IPA artifact
      # -------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: P-Slice-IPA
          path: export/*.ipa
