name: Build IPA (P-Slice)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Install Haxe + deps
      # =========================
      - name: Install Haxe + tools
        run: |
          brew update
          brew install haxe

          export HAXELIB_ROOT="$HOME/haxelib"
          mkdir -p $HAXELIB_ROOT
          haxelib setup $HAXELIB_ROOT

      # =========================
      # Install libraries (IMPORTANT: no manual macro calls)
      # =========================
      - name: Install Haxe libs
        run: |
          export HAXELIB_ROOT="$HOME/haxelib"

          haxelib install lime 8.3.2 --always
          haxelib install openfl 9.5.2 --always
          haxelib install flixel 5.6.2 --always
          haxelib install flixel-addons 3.3.2 --always

          haxelib install hxcpp 4.3.2 --always
          haxelib install hscript 2.7.0 --always
          haxelib install hscript-iris 1.1.3 --always
          haxelib install tjson 1.4.0 --always

          haxelib set lime 8.3.2
          haxelib set openfl 9.5.2
          haxelib set flixel 5.6.2
          haxelib set hxcpp 4.3.2

      # =========================
      # Fix Lime environment (CRITICAL)
      # =========================
      - name: Fix Haxe environment
        run: |
          echo "export HAXELIB_ROOT=$HOME/haxelib" >> $GITHUB_ENV
          echo "export HAXE_STD_PATH=/opt/homebrew/lib/haxe/std" >> $GITHUB_ENV
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      # =========================
      # Build iOS project using Lime (NOT raw haxe)
      # =========================
      - name: Build iOS (Lime)
        run: |
          export HAXELIB_ROOT="$HOME/haxelib"
          lime test ios -release

      # =========================
      # Build Xcode project
      # =========================
      - name: Build Xcode app
        run: |
          cd export/ios/bin

          xcodebuild \
            -project *.xcodeproj \
            -scheme * \
            -configuration Release \
            -sdk iphoneos \
            build

      # =========================
      # Package IPA
      # =========================
      - name: Package IPA
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/

          zip -r PSliceEngine.ipa Payload

      # =========================
      # Upload artifact
      # =========================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PSliceEngine-IPA
          path: PSliceEngine.ipa
