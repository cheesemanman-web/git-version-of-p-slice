name: Build IPA (P-Slice)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Haxe
        run: |
          brew update
          brew install haxe
          export PATH="/opt/homebrew/bin:$PATH"

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib

      - name: Install dependencies
        run: |
          haxelib install hxcpp
          haxelib install lime 8.2.2
          haxelib install openfl 9.3.3
          haxelib install flixel 5.6.2
          haxelib install flixel-addons 3.3.2
          haxelib install hscript
          haxelib install tjson
          haxelib install flxanimate
          haxelib install hxvlc

      # 🔥 IMPORTANT: build HAXE FIRST (outside Xcode)
      - name: Build Haxe manually
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          haxe Build.hxml -D HXCPP_ARM64 -cpp export/ios

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS (NO Haxe target)
        run: |
          export PATH="/opt/homebrew/bin:$PATH"

          xcodebuild \
            -project PSliceEngine.xcodeproj \
            -scheme PSliceEngine \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            clean build
