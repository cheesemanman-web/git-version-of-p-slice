name: Build IPA (P-Slice)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Install Haxe Toolchain
      # =========================
      - name: Install Haxe
        run: |
          brew update
          brew install haxe

          mkdir -p ~/.haxelib
          haxelib setup ~/.haxelib

      - name: Install Haxe libraries
        run: |
          haxelib install lime 8.3.2 --always
          haxelib install openfl 9.5.2 --always
          haxelib install hxcpp 4.3.2 --always
          haxelib install flixel --always
          haxelib install flixel-addons 3.3.2 --always
          haxelib install tjson 1.4.0 --always
          haxelib install hscript-iris 1.1.3 --always
          haxelib install grig.audio --always
          haxelib install flxanimate --always

      - name: Show versions
        run: |
          haxe -version
          haxelib list

      # =========================
      # Build Haxe (IMPORTANT FIX)
      # =========================
      - name: Compile Haxe
        working-directory: PSliceEngine/haxe
        run: |
          haxe Build.hxml -D HXCPP_ARM64

      # =========================
      # Build Xcode Project
      # =========================
      - name: Build Xcode app
        run: |
          xcodebuild \
            -project PSliceEngine.xcodeproj \
            -scheme PSliceEngine \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      # =========================
      # Find .app and package IPA
      # =========================
      - name: Package IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "PSliceEngine.app" | head -n 1)

          echo "Found app: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -r PSliceEngine.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PSliceEngine-IPA
          path: PSliceEngine.ipa
