name: Build IPA (P-Slice)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Install Haxe properly
      # =========================
      - name: Install Haxe
        run: |
          brew update
          brew install haxe

          # FIX: proper haxelib folder (IMPORTANT)
          export HAXELIB_PATH=$HOME/haxelib
          mkdir -p $HAXELIB_PATH

          haxelib setup $HAXELIB_PATH

      # =========================
      # Install dependencies
      # =========================
      - name: Install Haxe libs
        run: |
          export HAXELIB_PATH=$HOME/haxelib

          haxelib install lime 8.3.2 --always
          haxelib install openfl 9.5.2 --always
          haxelib install hxcpp 4.3.2 --always
          haxelib install flixel --always
          haxelib install flixel-addons 3.3.2 --always
          haxelib install tjson 1.4.0 --always
          haxelib install hscript-iris 1.1.3 --always
          haxelib install flxanimate --always

      - name: Fix Lime cache (IMPORTANT for DefineMacro error)
        run: |
          haxelib run lime setup

      # =========================
      # Show debug info
      # =========================
      - name: Versions
        run: |
          haxe -version
          haxelib list

      # =========================
      # Compile Haxe (FIX PATH!)
      # =========================
      - name: Compile Haxe
        run: |
          export HAXELIB_PATH=$HOME/haxelib

          cd PSliceEngine/haxe
          haxe Build.hxml -D HXCPP_ARM64

      # =========================
      # Build Xcode project
      # =========================
      - name: Build Xcode
        run: |
          xcodebuild \
            -project PSliceEngine.xcodeproj \
            -scheme PSliceEngine \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      # =========================
      # Package IPA
      # =========================
      - name: Create IPA
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "PSliceEngine.app" | head -n 1)

          echo "Found app: $APP"

          mkdir -p Payload
          cp -R "$APP" Payload/

          zip -r PSliceEngine.ipa Payload

      # =========================
      # Upload result
      # =========================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PSliceEngine-IPA
          path: PSliceEngine.ipa
