name: Build IPA (P-Slice)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Clean build
        run: |
          xcodebuild \
            -project PSliceEngine.xcodeproj \
            -scheme PSliceEngine \
            -configuration Release \
            -sdk iphoneos \
            clean build
