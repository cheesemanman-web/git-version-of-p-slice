name: Build IPA (P-Slice)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Install Haxe
      # =========================
      - name: Install Haxe
        run: |
          brew update
          brew install haxe

      # =========================
      # Setup Haxelib (FIXED)
      # =========================
      - name: Setup Haxelib
        run: |
          export HAXELIB_PATH=$HOME/haxelib
          mkdir -p $HAXELIB_PATH
          haxelib setup $HAXELIB_PATH

      # =========================
      # Install dependencies
      # =========================
      - name: Install Haxe libraries
        run: |
          export HAXELIB_PATH=$HOME/haxelib

          haxelib install lime 8.3.2 --always
          haxelib install openfl 9.5.2 --always
          haxelib install hxcpp 4.3.2 --always
          haxelib install flixel --always
          haxelib install flixel-addons 3.3.2 --always
          haxelib install tjson 1.4.0 --always
          haxelib install hscript-iris 1.1.3 --always
          haxelib install flxanimate --always

      # =========================
      # IMPORTANT: fix Lime macros
      # =========================
      - name: Activate & fix Lime/OpenFL
        run: |
          export HAXELIB_PATH=$HOME/haxelib

          haxelib set lime 8.3.2
          haxelib set openfl 9.5.2
          haxelib set hxcpp 4.3.2

          haxelib run lime setup
          haxelib run lime rebuild hxcpp

      # =========================
      # Debug versions
      # =========================
      - name: Show versions
        run: |
          haxe -version
          haxelib list

      # =========================
      # Compile Haxe (FIXED PATH)
      # =========================
      - name: Compile Haxe
        run: |
          export HAXELIB_PATH=$HOME/haxelib
          export HAXE_STD_PATH=/opt/homebrew/lib/haxe/std

          cd PSliceEngine/haxe
          haxe Build.hxml -D HXCPP_ARM64

      # =========================
      # Build Xcode project
      # =========================
      - name: Build Xcode app
        run: |
          xcodebuild \
            -project PSliceEngine.xcodeproj \
            -scheme PSliceEngine \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      # =========================
      # Package IPA
      # =========================
      - name: Create IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "PSliceEngine.app" | head -n 1)

          echo "Found app: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -r PSliceEngine.ipa Payload

      # =========================
      # Upload artifact
      # =========================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PSliceEngine-IPA
          path: PSliceEngine.ipa
