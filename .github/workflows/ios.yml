name: Build IPA (P-Slice)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      DEVELOPMENT_TEAM: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Install Haxe
      # -------------------------
      - name: Install Haxe
        run: |
          brew update
          brew install haxe

          haxelib setup ~/haxelib

      # -------------------------
      # EXACT LIB VERSIONS (MATCH PROJECT.XML ECOSYSTEM)
      # -------------------------
      - name: Install dependencies (LOCKED)
        run: |
          haxelib install hxcpp 4.3.2
          haxelib install lime 8.3.2
          haxelib install openfl 9.5.2

          haxelib install flixel 5.6.2
          haxelib install flixel-addons 3.3.2

          haxelib install tjson 1.4.0
          haxelib install flxanimate

          haxelib install hscript-iris 1.1.3

          haxelib list

      # -------------------------
      # FIX HAXE BUILD PATH
      # -------------------------
      - name: Build Haxe
        working-directory: ${{ github.workspace }}/PSliceEngine/haxe
        run: |
          haxe Build.hxml -D HXCPP_ARM64

      # -------------------------
      # XCODE BUILD (NO SIGNING)
      # -------------------------
      - name: Build iOS app
        run: |
          xcodebuild \
            -project PSliceEngine.xcodeproj \
            -scheme PSliceEngine \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      # -------------------------
      # ARCHIVE
      # -------------------------
      - name: Archive
        run: |
          xcodebuild \
            -project PSliceEngine.xcodeproj \
            -scheme PSliceEngine \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            archive \
            -archivePath build/PSliceEngine.xcarchive

      # -------------------------
      # EXPORT IPA
      # -------------------------
      - name: Export IPA
        run: |
          mkdir -p export

          xcodebuild -exportArchive \
            -archivePath build/PSliceEngine.xcarchive \
            -exportPath export \
            -exportOptionsPlist ExportOptions.plist

      # -------------------------
      # UPLOAD IPA
      # -------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: P-Slice-IPA
          path: export/*.ipa
