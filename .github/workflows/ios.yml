name: Build IPA (P-Slice)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      DEVELOPMENT_TEAM: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Haxe
        run: |
          brew update
          brew install haxe

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install lime
          haxelib install openfl
          haxelib install hxcpp
          haxelib install flixel
          haxelib run lime setup

      - name: Show versions
        run: |
          haxe -version
          xcodebuild -version

      - name: Build Haxe (manual compile step)
        working-directory: ${{ github.workspace }}
        run: |
          haxe Build.hxml -D HXCPP_ARM64

      - name: Clean + Build Xcode project
        working-directory: ${{ github.workspace }}
        run: |
          xcodebuild \
            -project PSliceEngine.xcodeproj \
            -scheme PSliceEngine \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            clean build
