name: P-Slice iOS Build (No Signing)

on:
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-latest

    env:
      HAXELIB_ROOT: ${{ github.workspace }}/.haxelib
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_IDENTITY: ""

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # =========================
      # Setup Haxe properly
      # =========================
      - name: Install Haxe + setup haxelib
        run: |
          brew install haxe
          mkdir -p $HAXELIB_ROOT
          haxelib setup $HAXELIB_ROOT

      # =========================
      # Install dependencies
      # =========================
      - name: Install Haxe libs
        run: |
          haxelib install lime 8.3.2 --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons 3.2.2 --quiet || true
          haxelib install hxcpp --quiet
          haxelib install tjson --quiet
          haxelib install hscript-iris --quiet

      # =========================
      # Build iOS project
      # =========================
      - name: Build iOS (Lime)
        run: |
          cd $GITHUB_WORKSPACE
          haxelib run lime build ios -verbose

      # =========================
      # HARD DISABLE XCODE SIGNING (IMPORTANT)
      # =========================
      - name: Disable Xcode signing
        run: |
          PROJ="bin/ios/PSliceEngine.xcodeproj/project.pbxproj"

          if [ -f "$PROJ" ]; then
            echo "Patching signing settings..."

            # remove team requirement
            sed -i '' 's/DEVELOPMENT_TEAM = .*;//g' "$PROJ" || true

            # remove provisioning profiles
            sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = .*;//g' "$PROJ" || true

            # disable code signing flags
            sed -i '' 's/CODE_SIGN_STYLE = .*;/CODE_SIGN_STYLE = Manual;/g' "$PROJ" || true

            echo "Signing disabled"
          fi

      # =========================
      # Rebuild after patch
      # =========================
      - name: Rebuild iOS (patched)
        run: |
          cd $GITHUB_WORKSPACE
          haxelib run lime build ios -verbose

      # =========================
      # Upload build output
      # =========================
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: bin/ios
