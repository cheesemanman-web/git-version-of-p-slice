name: Build P-Slice iOS (Unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe (fixed arm64-safe)
        run: |
          brew install haxe
          haxe -version

      - name: Install Haxelib deps
        run: |
          haxelib setup ~/haxelib
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install hxcpp
          haxelib install hscript
          haxelib install hscript-iris
          haxelib install tjson
          haxelib run lime setup

      - name: Fix project signing (IMPORTANT STEP)
        run: |
          cd PSliceEngine/bin/ios || true
          find . -name "*.xcodeproj" -print

          # Force disable signing in all configs
          if [ -d "PSliceEngine.xcodeproj" ]; then
            echo "Fixing Xcode signing settings..."

            defaults write "$(pwd)/project.pbxproj" CODE_SIGNING_REQUIRED -bool NO || true
            defaults write "$(pwd)/project.pbxproj" CODE_SIGNING_ALLOWED -bool NO || true
          fi

      - name: Build iOS (NO signing)
        run: |
          cd PSliceEngine

          haxelib run lime build ios -final -verbose \
            -D CODE_SIGNING_REQUIRED=NO \
            -D CODE_SIGNING_ALLOWED=NO \
            -D AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd PSliceEngine/bin/ios/Release-iphoneos || true
          mkdir Payload || true
          cp -r *.app Payload/ || true
          zip -r PSlice.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PSlice-Unsigned-IPA
          path: PSliceEngine/bin/ios/Release-iphoneos/PSlice.ipa
