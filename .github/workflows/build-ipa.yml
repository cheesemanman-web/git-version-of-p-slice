name: Build IPA (P-Slice)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Homebrew deps
        run: |
          brew update
          brew install haxe
          brew install neko

      - name: Setup Haxelib (FIX .haxelib ERROR)
        run: |
          export HAXELIB_ROOT="$HOME/haxelib"
          mkdir -p $HAXELIB_ROOT
          haxelib setup $HAXELIB_ROOT

      - name: Install Haxe dependencies (CRITICAL FIX for lime macro crash)
        run: |
          haxelib install lime 8.3.2 --quiet
          haxelib install openfl 9.5.2 --quiet
          haxelib install hxcpp 4.3.2 --quiet
          haxelib install flixel 5.6.2 --quiet
          haxelib install flixel-addons 3.3.2 --quiet
          haxelib install tjson 1.4.0 --quiet
          haxelib install hscript-iris 1.1.3 --quiet || true
          haxelib install flxanimate --quiet || true

      - name: Set correct Haxe versions
        run: |
          haxelib set lime 8.3.2
          haxelib set openfl 9.5.2
          haxelib set hxcpp 4.3.2

      - name: Verify Lime macro fix
        run: |
          haxelib list
          haxe -version

      - name: Build Haxe project (FIX PATH ISSUE)
        run: |
          cd PSliceEngine/haxe
          haxe Build.hxml -D HXCPP_ARM64

      - name: Install CocoaPods (iOS build requirement)
        run: |
          sudo gem install cocoapods

      - name: Build iOS App (.app)
        run: |
          cd PSliceEngine
          haxelib run lime build ios -release

      - name: Create IPA (FIXED packaging)
        run: |
          mkdir -p Payload
          cp -r bin/ios/build/Release-iphoneos/*.app Payload/

          zip -r PSlice.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: P-Slice-IPA
          path: PSlice.ipa
