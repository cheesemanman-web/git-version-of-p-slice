name: Build IPA (P-Slice)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Haxe + tools
        run: |
          brew update
          brew install haxe

          haxelib setup $HOME/haxelib

      - name: Install dependencies (STABLE P-SLICE STACK)
        run: |
          export PATH="/opt/homebrew/bin:$PATH"

          haxelib install lime 8.1.2 --quiet
          haxelib install openfl 9.3.3 --quiet
          haxelib install flixel 6.1.2 --quiet
          haxelib install flixel-addons 3.3.2 --quiet
          haxelib install hxcpp 4.3.2 --quiet
          haxelib install hscript 2.7.0 --quiet
          haxelib install hscript-iris 1.1.3 --quiet
          haxelib install tjson 1.4.0 --quiet

          haxelib set lime 8.1.2
          haxelib set openfl 9.3.3
          haxelib set flixel 6.1.2
          haxelib set hxcpp 4.3.2

      - name: Verify project structure
        run: |
          ls -R

      - name: Build iOS (LIME - CORRECT WAY)
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          cd PSliceEngine

          lime build ios -release

      - name: Find .app
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.app" | head -n 1)
          echo "APP=$APP" >> $GITHUB_ENV

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "$APP" Payload/

          zip -r PSliceEngine.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PSliceEngine-IPA
          path: PSliceEngine.ipa
