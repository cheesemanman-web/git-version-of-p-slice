name: Build IPA (P-Slicev2)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      HAXELIB_ROOT: ~/haxelib
      DERIVED_DATA: ~/Library/Developer/Xcode/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # XCODE SETUP
      # =========================
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      # =========================
      # HAXE INSTALL
      # =========================
      - name: Install Haxe
        run: |
          brew update
          brew install haxe
          haxelib setup $HAXELIB_ROOT

      # =========================
      # CACHE HAXELIB (IMPORTANT)
      # =========================
      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: ${{ runner.os }}-haxelib-${{ hashFiles('**/hxml', '**/haxelib.json', '**/project.xml') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-

      # =========================
      # INSTALL DEPENDENCIES
      # =========================
      - name: Install Haxe dependencies
        run: |
          haxelib install lime --always
          haxelib install openfl --always
          haxelib install hxcpp --always
          haxelib install flixel --always
          haxelib install flixel-addons --always
          haxelib install hscript --always
          haxelib install hscript-iris --always
          haxelib install tjson --always

      # =========================
      # OPTIONAL HMM
      # =========================
      - name: Install HMM (optional)
        run: |
          haxelib install hmm --always || true
          if [ -f hmm.json ]; then
            haxelib run hmm install
          fi

      # =========================
      # BUILD XCODE
      # =========================
      - name: Build Xcode project
        run: |
          set -o pipefail

          xcodebuild \
            -project "$GITHUB_WORKSPACE/PSliceEngine.xcodeproj" \
            -scheme PSliceEngine \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      # =========================
      # FIND APP (ROBUST)
      # =========================
      - name: Locate .app
        run: |
          APP=$(find "$DERIVED_DATA" -type d -name "*.app" | grep "Release-iphoneos" | head -n 1)
          echo "APP=$APP" >> $GITHUB_ENV
          echo "Found app: $APP"

      # =========================
      # CREATE PROPER IPA
      # =========================
      - name: Create IPA
        run: |
          set -e

          mkdir -p Payload
          cp -R "$APP" Payload/

          rm -f PSliceEngine.ipa
          ditto -c -k --sequesterRsrc --keepParent Payload PSliceEngine.ipa

      # =========================
      # UPLOAD ARTIFACT
      # =========================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PSliceEngine-IPA
          path: PSliceEngine.ipa
