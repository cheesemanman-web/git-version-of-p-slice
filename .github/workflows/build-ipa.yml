name: Build IPA (P-Slicev2)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Xcode project
        run: |
          set -o pipefail

          xcodebuild \
            -project PSliceEngine.xcodeproj \
            -scheme PSliceEngine \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Find .app (reliable)
        run: |
          APP=$(find . -type d -name "*.app" | grep -i "Release-iphoneos" | head -n 1)

          if [ -z "$APP" ]; then
            echo "No .app found"
            find . -name "*.app"
            exit 1
          fi

          echo "APP=$APP"
          echo "APP=$APP" >> $GITHUB_ENV

      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r PSliceEngine.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PSliceEngine-IPA
          path: PSliceEngine.ipa
