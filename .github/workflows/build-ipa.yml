name: Build iOS IPA (P-Slice ARM64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest   # ✅ fast queue ARM64 runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # FIX: Install Haxe manually (ARM64 compatible)
      # =========================
      - name: Install Haxe + tools
        run: |
          brew update

          # Install Haxe (ARM64 native)
          brew install haxe

          # Setup haxelib
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib

      # =========================
      # Install dependencies
      # =========================
      - name: Install Haxe libs
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install hxcpp
          haxelib install hscript
          haxelib install hscript-iris
          haxelib install tjson
          haxelib run lime setup

      # =========================
      # Fix iOS SDK environment
      # =========================
      - name: Setup iOS toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      # =========================
      # Build IPA (or iOS project)
      # =========================
      - name: Build iOS
        run: |
          cd PSliceEngine
          haxelib run lime build ios -release
