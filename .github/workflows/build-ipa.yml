name: iOS Build (P-Slice)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    env:
      HAXELIB_ROOT: ${{ github.workspace }}/.haxelib
      HOMEBREW_NO_AUTO_UPDATE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ========================
      # FIX HAXELIB (CRITICAL)
      # ========================
      - name: Setup Haxe (manual safe install)
        run: |
          brew install haxe
          mkdir -p $HAXELIB_ROOT
          haxelib setup $HAXELIB_ROOT

      # ========================
      # INSTALL LIBS (FIXES YOUR ERROR)
      # ========================
      - name: Install Haxe libs
        run: |
          haxelib install lime 8.3.2 --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons 3.2.2 --quiet || true
          haxelib install hxcpp --quiet
          haxelib install tjson --quiet
          haxelib install hscript-iris --quiet

      # ========================
      # VERIFY PROJECT LOCATION FIX
      # ========================
      - name: Verify project.xml
        run: |
          echo "Root files:"
          ls -la
          test -f project.xml || (echo "project.xml missing in root" && exit 1)

      # ========================
      # BUILD IOS (LIME)
      # ========================
      - name: Build iOS (no signing fix)
        run: |
          cd $GITHUB_WORKSPACE

          # CRITICAL: disables Xcode signing requirement
          export FASTSIM=true

          haxelib run lime build ios -verbose

      # ========================
      # FIX SIGNING ERROR (REAL FIX)
      # ========================
      - name: Patch Xcode signing (CI bypass)
        run: |
          PROJ="bin/ios/PSliceEngine.xcodeproj/project.pbxproj"

          if [ -f "$PROJ" ]; then
            sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' $PROJ || true
            sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' $PROJ || true
            echo "Signing patched"
          fi

      # ========================
      # REBUILD AFTER PATCH
      # ========================
      - name: Rebuild after signing patch
        run: |
          haxelib run lime build ios -verbose

      # ========================
      # ARTIFACT OUTPUT
      # ========================
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            bin/ios
