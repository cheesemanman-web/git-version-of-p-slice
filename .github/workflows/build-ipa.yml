name: Build iOS IPA (P-Slice)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # =========================
      # Debug: confirm project.xml exists
      # =========================
      - name: Check repo structure
        run: |
          pwd
          ls -R

      # =========================
      # Install Haxe (ARM64 safe)
      # =========================
      - name: Install Haxe
        run: |
          brew update
          brew install haxe
          haxelib setup ~/haxelib

      # =========================
      # Install dependencies
      # =========================
      - name: Install Haxe libs
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install hxcpp
          haxelib install hscript
          haxelib install hscript-iris
          haxelib install tjson
          haxelib run lime setup

      # =========================
      # FIXED BUILD (explicit path)
      # =========================
      - name: Build iOS
        run: |
          if [ ! -f "project.xml" ]; then
            echo "ERROR: project.xml NOT FOUND in root"
            exit 1
          fi

          haxelib run lime build project.xml ios -release
