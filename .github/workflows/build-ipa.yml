name: Build IPA (P-Slicev2)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Haxe
        run: |
          brew update
          brew install haxe
          haxelib setup ~/haxelib

      # ✅ FIX: install ALL required haxelib deps BEFORE Xcode builds
      - name: Install Haxe dependencies
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install hxcpp --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet

      - name: Install HMM (optional but safer)
        run: |
          haxelib install hmm --quiet || true
          haxelib run hmm install || true

      - name: Export PATH
        run: echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Debug files
        run: ls -la

      - name: Build Xcode project
        run: |
          set -o pipefail

          xcodebuild \
            -project "$GITHUB_WORKSPACE/PSliceEngine.xcodeproj" \
            -scheme PSliceEngine \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Find .app
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
          echo "APP=$APP" >> $GITHUB_ENV

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r PSliceEngine.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PSliceEngine-IPA
          path: PSliceEngine.ipa
