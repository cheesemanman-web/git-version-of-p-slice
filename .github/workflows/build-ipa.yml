name: please build ipa brochacho

on:
  workflow_dispatch:
  push:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      # =========================
      # INSTALL HAXE (FIX ARM64 ISSUE)
      # =========================
      - name: install haxe and dependencies
        run: |
          brew update
          brew install haxe neko

          mkdir -p $GITHUB_WORKSPACE/.haxelib
          echo "HAXELIB_ROOT=$GITHUB_WORKSPACE/.haxelib" >> $GITHUB_ENV
          echo "HAXE_STD_PATH=$(brew --prefix haxe)/lib/haxe/std" >> $GITHUB_ENV

          haxelib setup $GITHUB_WORKSPACE/.haxelib

      # =========================
      # INSTALL LIBS
      # =========================
      - name: Install haxelib deps
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install hxcpp
          haxelib install hscript
          haxelib install hscript-iris
          haxelib install tjson

      # =========================
      # FORCE PROJECT ROOT
      # =========================
      - name: verify project
        run: |
          ls -R
          test -f project.xml

      # =========================
      # DISABLE XCODE SIGNING (IMPORTANT)
      # =========================
      - name: config xcode to shut up about signing
        run: |
          echo "Disabling code signing for CI build..."

          defaults write com.apple.dt.Xcode IDEPackageOnlyUseVersionsFromResolvedFile -bool YES

      # =========================
      # BUILD IOS PLEASE BRO
      # =========================
      - name: shut up xcode
        run: |
          export DEVELOPER_DIR="/Applications/Xcode.app/Contents/Developer"

          haxelib run lime build ios -nosign \
            -D simulator \
            -D NO_CODE_SIGNING \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER=""

      # =========================
      # PACKAGE OUTPUT
      # =========================
      - name: YES YES YES
        uses: actions/upload-artifact@v4
        with:
          name: pslice-ios-build
          path: |
            export/release/ios/bin
            bin/ios
