name: iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Install libs
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install hscript
          haxelib install tjson
          haxelib install hxcpp

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: |
            ~/haxelib
            ~/Library/Caches/haxe
          key: haxe-${{ runner.os }}-${{ hashFiles('**/*.hxml') }}

      - name: Build Haxe
        run: |
          haxe PSliceEngine/haxe/Build.hxml -D HXCPP_ARM64

      - name: Build iOS IPA
        run: |
          cd export/ios || true
          xcodebuild -project PSliceEngine.xcodeproj \
            -scheme PSliceEngine \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build
