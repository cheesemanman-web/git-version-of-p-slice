name: P-Slice iOS IPA Build (FIXED HAXELIB PATH)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Install Haxe
      # =========================
      - name: Install Haxe
        run: |
          brew update
          brew install haxe
          haxe -version

      # =========================
      # FIX: Use LOCAL haxelib folder (IMPORTANT)
      # =========================
      - name: Setup Haxelib (FIXED PATH)
        run: |
          export HAXELIB_ROOT=$GITHUB_WORKSPACE/.haxelib
          mkdir -p $HAXELIB_ROOT
          haxelib setup $HAXELIB_ROOT

          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install hxcpp
          haxelib install hscript
          haxelib install hscript-iris
          haxelib install tjson

          haxelib run lime setup

      # =========================
      # Fix Lime config safely
      # =========================
      - name: Fix Lime config
        run: |
          mkdir -p ~/.lime
          echo "<config />" > ~/.lime/config.xml

      # =========================
      # Debug structure
      # =========================
      - name: Show project structure
        run: ls -R

      # =========================
      # Build iOS (ROOT PROJECT.XML)
      # =========================
      - name: Build iOS (NO SIGNING)
        run: |
          export HAXELIB_ROOT=$GITHUB_WORKSPACE/.haxelib

          haxelib run lime build ios -verbose \
            -D CODE_SIGNING_REQUIRED=NO \
            -D CODE_SIGNING_ALLOWED=NO \
            -D AD_HOC_CODE_SIGNING_ALLOWED=NO

      # =========================
      # Package IPA
      # =========================
      - name: Create IPA
        run: |
          cd bin/ios/Release-iphoneos || exit 0

          mkdir -p Payload
          cp -r *.app Payload/

          zip -r P-Slice.ipa Payload

      # =========================
      # Upload artifact
      # =========================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: P-Slice-iOS-IPA
          path: bin/ios/Release-iphoneos/P-Slice.ipa
