name: Build IPA (P-Slicev2)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Xcode setup
      # =========================
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # =========================
      # Cache Haxelib
      # =========================
      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: |
            ~/haxelib
            ~/.haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('**/*.hxml') }}

      # =========================
      # Install Haxe
      # =========================
      - name: Install Haxe
        run: |
          brew update
          brew install haxe || true
          haxelib setup ~/haxelib

      # =========================
      # Install dependencies
      # =========================
      - name: Install Haxe dependencies
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install hxcpp --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install hscript --quiet
          haxelib install hscript-iris --quiet
          haxelib install tjson --quiet

      # =========================
      # Cache Xcode DerivedData
      # =========================
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-${{ runner.os }}-${{ hashFiles('**/*.xcodeproj/**') }}

      # =========================
      # PATH fix
      # =========================
      - name: Export PATH
        run: echo "/opt/homebrew/bin" >> $GITHUB_PATH

      # =========================
      # BUILD HAXE (FIXED CORE)
      # =========================
      - name: Build Haxe
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/PSliceEngine"

          echo "=== Project structure ==="
          ls -R haxe

          echo "=== Running Haxe build ==="
          haxe haxe/Build.hxml -D HXCPP_ARM64 -cpp build/ios

      # =========================
      # Build Xcode project
      # =========================
      - name: Build Xcode
        run: |
          set -e

          xcodebuild \
            -project "$GITHUB_WORKSPACE/PSliceEngine.xcodeproj" \
            -scheme PSliceEngine \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      # =========================
      # Better IPA packaging
      # =========================
      - name: Create IPA
        run: |
          set -e

          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)

          echo "Found app: $APP_PATH"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          zip -r PSliceEngine.ipa Payload

      # =========================
      # Upload artifact
      # =========================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PSliceEngine-IPA
          path: PSliceEngine.ipa
