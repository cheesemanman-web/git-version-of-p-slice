name: P-Slice iOS Build (No Signing)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Haxe
        run: |
          brew update
          brew install haxe
          haxelib setup ~/haxelib

      - name: Install libs
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons 3.3.2
          haxelib install hxcpp
          haxelib install tjson
          haxelib install hscript
          haxelib install hscript-iris

      - name: Build iOS (generate Xcode project)
        run: |
          haxelib run lime build ios

      - name: Disable code signing (IMPORTANT)
        run: |
          PROJ="bin/ios/PSliceEngine.xcodeproj/project.pbxproj"

          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' $PROJ || true
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' $PROJ || true
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' $PROJ || true

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-export
          path: bin/ios
