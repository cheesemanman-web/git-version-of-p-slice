name: Build IPA (P-Slicev2)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # =========================
      # CACHE: Homebrew + Haxe libs
      # =========================
      - name: Cache Haxelib
        uses: actions/cache@v4
        with:
          path: |
            ~/haxelib
            ~/.haxelib
          key: haxelib-${{ runner.os }}-${{ hashFiles('**/*.hxml') }}

      - name: Install Haxe
        run: |
          brew update
          brew install haxe || true
          haxelib setup ~/haxelib

      - name: Install Haxe dependencies
        run: |
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install hxcpp --quiet
          haxelib install flixel --quiet
          haxelib install flixel-addons --quiet
          haxelib install flixel-ui --quiet
          haxelib install hscript --quiet
          haxelib install hscript-iris --quiet
          haxelib install tjson --quiet

      # =========================
      # CACHE: DerivedData (Xcode speed boost)
      # =========================
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-${{ runner.os }}-${{ hashFiles('**/*.xcodeproj/**') }}

      - name: Export PATH
        run: echo "/opt/homebrew/bin" >> $GITHUB_PATH

      # =========================
      # FIXED BUILD STEP (THIS WAS YOUR BUG)
      # =========================
      - name: Build Haxe + Xcode
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          echo "=== Running Haxe ==="
          haxe haxe/Build.hxml -D HXCPP_ARM64 -cpp build/ios

          echo "=== Running Xcode build ==="
          xcodebuild \
            -project "$GITHUB_WORKSPACE/PSliceEngine.xcodeproj" \
            -scheme PSliceEngine \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      # =========================
      # BETTER IPA PACKAGING (NO DerivedData guessing)
      # =========================
      - name: Create IPA (proper method)
        run: |
          set -e

          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)

          echo "Found app: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -r PSliceEngine.ipa Payload

      # =========================
      # ARTIFACT UPLOAD
      # =========================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PSliceEngine-IPA
          path: PSliceEngine.ipa
