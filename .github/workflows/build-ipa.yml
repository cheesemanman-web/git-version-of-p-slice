name: iOS Build (Unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-13

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Install Haxelib dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install hxcpp
          haxelib install tjson
          haxelib install hscript-iris
          haxelib list

      - name: Install project dependencies (if hxml exists)
        run: |
          if [ -f "PSliceEngine/haxe/Build.hxml" ]; then
            echo "Found Build.hxml"
          fi

      - name: Build iOS (NO SIGNING FIX)
        run: |
          cd PSliceEngine || exit 1

          lime build ios -release \
            -D ios \
            -D NO_CODE_SIGN \
            -D CODE_SIGNING_ALLOWED=0 \
            -D CODE_SIGNING_REQUIRED=0

      - name: Patch Xcode signing (extra safety)
        run: |
          PROJ="bin/ios/PSliceEngine.xcodeproj"

          if [ -d "$PROJ" ]; then
            echo "Disabling code signing in project"
            /usr/libexec/PlistBuddy -c "Set :objects:CODE_SIGN_IDENTITY ''" "$PROJ/project.pbxproj" || true
          fi

      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: PSliceEngine/bin/ios
