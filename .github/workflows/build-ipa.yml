name: P-Slice iOS IPA Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # =========================
      # Checkout repo
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Install Haxe (safe method)
      # =========================
      - name: Install Haxe
        run: |
          brew update
          brew install haxe
          haxe -version

      # =========================
      # Setup stable haxelib (NO HOME hacks)
      # =========================
      - name: Setup Haxelib + dependencies
        run: |
          mkdir -p ~/.haxelib
          haxelib setup ~/.haxelib

          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install hxcpp
          haxelib install hscript
          haxelib install hscript-iris
          haxelib install tjson

          haxelib run lime setup

      # =========================
      # Fix Lime config (safe)
      # =========================
      - name: Fix Lime config
        run: |
          mkdir -p ~/.lime
          echo "<config />" > ~/.lime/config.xml

      # =========================
      # Debug project structure
      # =========================
      - name: Show repo structure
        run: |
          ls -R

      # =========================
      # Build iOS from ROOT (IMPORTANT)
      # =========================
      - name: Build iOS (unsigned)
        run: |
          haxelib run lime build ios -verbose \
            -D CODE_SIGNING_REQUIRED=NO \
            -D CODE_SIGNING_ALLOWED=NO \
            -D AD_HOC_CODE_SIGNING_ALLOWED=NO

      # =========================
      # Package IPA
      # =========================
      - name: Package IPA
        run: |
          cd bin/ios/Release-iphoneos || exit 0

          mkdir -p Payload
          cp -r *.app Payload/

          zip -r P-Slice.ipa Payload

      # =========================
      # Upload artifact
      # =========================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: P-Slice-iOS-IPA
          path: bin/ios/Release-iphoneos/P-Slice.ipa
