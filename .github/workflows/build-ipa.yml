name: Build P-Slice iOS IPA

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Haxe (safe method)
        run: |
          brew install haxe
          haxe -version

      - name: Setup Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-addons
          haxelib install hxcpp
          haxelib install hscript
          haxelib install hscript-iris
          haxelib install tjson
          haxelib run lime setup

      - name: Show project location (debug)
        run: |
          ls -R

      - name: Build iOS (ROOT FIX)
        run: |
          haxelib run lime build ios -verbose \
            -D CODE_SIGNING_REQUIRED=NO \
            -D CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd bin/ios/Release-iphoneos || exit 0
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r PSlice.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PSlice-IPA
          path: bin/ios/Release-iphoneos/PSlice.ipa
