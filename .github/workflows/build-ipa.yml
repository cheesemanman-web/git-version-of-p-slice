name: Build IPA (P-Slice)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Haxe
        run: |
          brew update
          brew install haxe

      - name: Setup haxelib
        run: |
          export HAXELIB_ROOT="$HOME/haxelib"
          mkdir -p $HAXELIB_ROOT
          haxelib setup $HAXELIB_ROOT

      - name: Install dependencies (FIXED STACK)
        run: |
          export HAXELIB_ROOT="$HOME/haxelib"

          haxelib remove lime || true
          haxelib remove openfl || true
          haxelib remove flixel || true

          haxelib install lime 8.3.2 --force
          haxelib install openfl 9.5.2 --force
          haxelib install flixel 5.6.2 --force
          haxelib install flixel-addons 3.3.2 --force

          haxelib install hxcpp 4.3.2 --force
          haxelib install hscript 2.7.0 --force
          haxelib install hscript-iris 1.1.3 --force
          haxelib install tjson 1.4.0 --force

          haxelib set lime 8.3.2
          haxelib set openfl 9.5.2
          haxelib set flixel 5.6.2
          haxelib set hxcpp 4.3.2

      - name: Verify installs
        run: |
          haxelib list

      - name: Build Haxe
        run: |
          export HAXELIB_ROOT="$HOME/haxelib"
          export HAXE_STD_PATH="/opt/homebrew/lib/haxe/std"

          cd PSliceEngine/haxe
          haxe Build.hxml -D HXCPP_ARM64

      - name: Build iOS app (Xcode)
        run: |
          cd PSliceEngine
          xcodebuild \
            -project PSliceEngine.xcodeproj \
            -scheme PSliceEngine \
            -configuration Release \
            -sdk iphoneos \
            build

      - name: Package IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "PSliceEngine.app" | head -n 1)

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/

          zip -r PSliceEngine.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PSliceEngine-IPA
          path: PSliceEngine.ipa
